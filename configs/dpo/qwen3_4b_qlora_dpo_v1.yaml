### model: merged SFT-v1 is the fixed initialization/reference
model_name_or_path: outputs/models/qwen3_4b_sft_v1_merged
quantization_bit: 4
quantization_method: bnb
trust_remote_code: true

### method: disabling the new DPO adapter yields the merged SFT-v1 reference
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
pref_loss: sigmoid
pref_beta: 0.1

### dataset
dataset: dpo_v1_grounded_63
dataset_dir: data/llamafactory
template: qwen3_nothink
cutoff_len: 2048
preprocessing_num_workers: 1
dataloader_num_workers: 0

### output
output_dir: outputs/train/qwen3_4b_qlora_dpo_v1
logging_steps: 1
save_steps: 10
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
gradient_checkpointing: true
bf16: true
seed: 42
